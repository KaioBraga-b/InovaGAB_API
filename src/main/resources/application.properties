spring.application.name=inovagab

# MongoDB — credenciais separadas (mais confiável no Spring Boot 4 / Spring Data MongoDB 5)
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=inovagab_db
spring.data.mongodb.username=root
spring.data.mongodb.password=secret
spring.data.mongodb.authentication-database=admin
spring.data.mongodb.auto-index-creation=false

# JWT
inovagab.jwt.secret=9a3f8b1c4e7d2a5f8e0b3c6d9a1f4e7d2a5f8e0b3c6d9a1f4e7d2a5f8e0b3c6d
inovagab.jwt.expiration-ms=86400000

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs

# Desabilita o gerenciamento automático do Docker Compose pelo Spring Boot
# (usamos o container iniciado manualmente via "docker compose up -d")
spring.docker.compose.enabled=false
