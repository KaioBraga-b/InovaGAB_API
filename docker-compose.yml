# ==============================================================================
# Docker Compose — InovaGAB API (Cidades ESG Inteligentes)
# Orquestra: Aplicação Spring Boot + MongoDB + Mongo Express (admin UI)
# ==============================================================================

services:
  # ============================================================================
  # MongoDB 7.0 — Banco NoSQL principal
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: inovagab-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-inovagab_db}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-secret}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - inovagab-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================================
  # Mongo Express — Interface Web para administração do MongoDB
  # ============================================================================
  mongo-express:
    image: mongo-express:1.0
    container_name: inovagab-mongo-express
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USERNAME:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-secret}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USERNAME:-root}:${MONGO_PASSWORD:-secret}@mongodb:27017/
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASS:-admin123}
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    networks:
      - inovagab-network

  # ============================================================================
  # InovaGAB API — Aplicação Spring Boot (Java 24)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inovagab-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      SPRING_DATA_MONGODB_HOST: mongodb
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: ${MONGO_DATABASE:-inovagab_db}
      SPRING_DATA_MONGODB_USERNAME: ${MONGO_USERNAME:-root}
      SPRING_DATA_MONGODB_PASSWORD: ${MONGO_PASSWORD:-secret}
      SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE: admin
      INOVAGAB_JWT_SECRET: ${JWT_SECRET:-9a3f8b1c4e7d2a5f8e0b3c6d9a1f4e7d2a5f8e0b3c6d9a1f4e7d2a5f8e0b3c6d}
      INOVAGAB_JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - inovagab-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ==============================================================================
# Rede e Volumes persistentes
# ==============================================================================
networks:
  inovagab-network:
    driver: bridge
    name: inovagab-network

volumes:
  mongo_data:
    name: inovagab-mongo-data
