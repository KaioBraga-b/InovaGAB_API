services:
  mongodb:
    image: 'mongo:latest'
    container_name: inovagab-mongo
    environment:
      - 'MONGO_INITDB_DATABASE=inovagab_db'
      - 'MONGO_INITDB_ROOT_PASSWORD=secret'
      - 'MONGO_INITDB_ROOT_USERNAME=root'
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
